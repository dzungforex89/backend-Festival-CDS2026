services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contractflow
      POSTGRES_USER: contractflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U contractflow']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql+psycopg://contractflow:${POSTGRES_PASSWORD}@db:5432/contractflow
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
